name: Release — Alpha

# Triggered by:
#   • push to the `alpha` branch (auto-synced from main via PAT)
#   • daily schedule (03:00 UTC)
#   • manual dispatch
#
# Build context: the `alpha` branch HEAD (mirrors main).
# Promote to beta by manually dispatching the beta workflow.

on:
  push:
    branches:
      - alpha
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: windows-latest
    outputs:
      next_version: ${{ steps.gen.outputs.next_version }}
    steps:
      - name: Compute next alpha version
        id: gen
        shell: bash
        run: echo "next_version=$(node scripts/next-version.cjs alpha)" >> "$GITHUB_OUTPUT"

  release:
    needs: compute-version
    uses: ./.github/workflows/release.yml
    with:
      channel: alpha
      tag_name: v${{ needs.compute-version.outputs.next_version }}
      artifact_name: windows-alpha-${{ github.sha }}
    secrets: inherit
