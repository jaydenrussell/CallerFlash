name: Release — Beta

# Triggered by manual dispatch ONLY.
# Automatically merges the latest alpha branch before building.
#
# Build context: the merged result (alpha → beta).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge alpha → beta
    runs-on: ubuntu-latest
    outputs:
      beta_ref: ${{ steps.promote.outputs.beta_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Merge alpha into beta
        id: promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin alpha
          git checkout beta || git checkout -b beta
          git reset origin/beta --hard
          git merge origin/alpha --no-ff -m "chore: merge alpha → beta for release" || true
          echo "beta_ref=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push beta
        run: git push origin beta --force

  release:
    name: Build & Release
    needs: sync
    uses: ./.github/workflows/release.yml
    with:
      channel: beta
      tag_name: v${{ needs.sync.outputs.beta_ref }}
      artifact_name: windows-beta-${{ github.sha }}
    secrets: inherit
