name: Release — Beta

# Triggered by manual dispatch ONLY.
# Merges the latest alpha branch into beta, computes the next beta
# semver tag (X.Y.Z-beta.N), then triggers the reusable Windows build.
#
# Flow: main → alpha (auto) → beta (manual) → stable (manual) → main (sync)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge alpha into beta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Merge alpha into beta
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin alpha
          git checkout beta || git checkout -b beta
          git reset origin/beta --hard
          git merge origin/alpha --no-ff -m "chore: merge alpha -> beta for release" || true

      - name: Compute next beta version
        id: gen
        shell: bash
        run: echo "version=$(node scripts/next-version.cjs beta)" >> "$GITHUB_OUTPUT"

      - name: Push beta
        run: git push origin beta --force

  release:
    name: Build & Release
    needs: sync
    uses: ./.github/workflows/release.yml
    with:
      channel: beta
      tag_name: v${{ needs.sync.outputs.version }}
      artifact_name: windows-beta-${{ github.sha }}
      prerelease: true
    secrets: inherit
