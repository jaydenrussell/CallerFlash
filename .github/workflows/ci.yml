name: CI — Pull Request Checks

on:
  pull_request:
    branches: [main, stable]
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build check
        run: npm run build

  rust:
    name: Rust Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Audit dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          # All ignored advisories are informational warnings (unmaintained/unsound),
          # not build-failing vulnerabilities; cargo-audit still exits 0 on them.
          #
          # Linux-only transitive deps (never compiled on Windows; target-gated via
          # tray-icon -> libappindicator -> gtk-rs GTK3, or glib-macros). The gtk-rs
          # GTK3 bindings are unmaintained upstream with no replacement on the
          # 0.18.x line, and glib's unsoundness only matters on platforms that
          # actually compile it. Matches the existing dependabot dismissals.
          #   - RUSTSEC-2024-0411 gdkwayland-sys
          #   - RUSTSEC-2024-0412 gdk
          #   - RUSTSEC-2024-0413 atk
          #   - RUSTSEC-2024-0414 gdkx11-sys
          #   - RUSTSEC-2024-0415 gtk
          #   - RUSTSEC-2024-0416 atk-sys
          #   - RUSTSEC-2024-0417 gdkx11
          #   - RUSTSEC-2024-0418 gdk-sys
          #   - RUSTSEC-2024-0419 gtk3-macros
          #   - RUSTSEC-2024-0420 gtk-sys
          #   - RUSTSEC-2024-0370 proc-macro-error
          #   - RUSTSEC-2024-0429 glib (same advisory as GHSA-wrw7-89jp-8q8g)
          #
          # Windows-reachable but unmaintained informational warnings with no fix
          # available: pulled by tauri-utils v2.9.3 -> urlpattern 0.3.0 (unic-*
          # Unicode crate family). urlpattern 0.6.0 replaces them with icu_properties
          # but tauri-utils pins ^0.3.0; no newer tauri-utils exists yet, so this
          # clears when Tauri bumps urlpattern upstream.
          #   - RUSTSEC-2025-0081 unic-char-property
          #   - RUSTSEC-2025-0075 unic-char-range
          #   - RUSTSEC-2025-0080 unic-common
          #   - RUSTSEC-2025-0100 unic-ucd-ident
          #   - RUSTSEC-2025-0098 unic-ucd-version
          cargo audit --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0419 --ignore RUSTSEC-2024-0420 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0081 --ignore RUSTSEC-2025-0075 --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0098

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
