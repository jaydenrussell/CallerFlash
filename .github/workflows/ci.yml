name: CI — Pull Request Checks

on:
  pull_request:
    branches: [main, stable]
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build check
        run: npm run build

  rust:
    name: Rust Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Audit dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          # RUSTSEC-2024-0429 (glib) is a Linux-only transitive dep (gtk/webkit2gtk);
          # it is never compiled on Windows, matching the dependabot dismissal.
          cargo audit --ignore RUSTSEC-2024-0429

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
