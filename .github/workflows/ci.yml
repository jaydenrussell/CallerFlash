name: CI

on:
  pull_request:
    branches: [main, stable]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Run tests with coverage gate
        run: npm run test:coverage

      - name: Build check
        run: npm run build

  rust:
    name: Rust Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Audit dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          # Advisory ignores live in .cargo/audit.toml next to the manifest,
          # with per-entry rationale and last-reviewed dates. Re-review
          # quarterly and whenever a dependency bump clears an entry.
          cargo audit

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage gate
        working-directory: src-tauri
        # Floor sits at the measured baseline (~25.6% lines); blocks
        # regressions. Raise as coverage improves.
        run: cargo llvm-cov --fail-under-lines 25
