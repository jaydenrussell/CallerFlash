name: CI — Pull Request Checks

on:
  pull_request:
    branches: [main, stable]
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build check
        run: npm run build

  rust:
    name: Rust Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-make
            make
            mingw-w64-x86_64-git
          release: false

      - name: Install pkg-config explicitly
        shell: msys2 {0}
        run: pacman -S --noconfirm mingw-w64-x86_64-pkgconf

      - name: Build and install PJSIP from source
        shell: msys2 {0}
        run: |
          git clone https://github.com/pjsip/pjproject.git /tmp/pjproject
          cd /tmp/pjproject
          ./configure --prefix=/mingw64 --disable-video --enable-shared=no
          mingw32-make -j4 || true
          mingw32-make install

      - name: Setup Rust (GNU target, compatible with MSYS2 PJSIP)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml