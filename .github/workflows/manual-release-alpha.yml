name: Manual Release — Alpha

# Manual release workflow for the alpha channel.
# This workflow does not auto-sync from main; use manual dispatch to
# trigger a release from the checked-out alpha branch.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish. If blank, auto-generates 0.1.N-alpha.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  compute-version:
    if: ${{ !inputs.tag_name }}
    runs-on: windows-latest
    outputs:
      next_version: ${{ steps.gen.outputs.next_version }}
    steps:
      - name: Compute next alpha version
        id: gen
        shell: bash
        run: echo "next_version=$(node scripts/next-version.cjs alpha)" >> "$GITHUB_OUTPUT"

  release:
    needs: compute-version
    uses: ./.github/workflows/release.yml
    with:
      channel: alpha
      tag_name: ${{ inputs.tag_name || format('v{0}', needs.compute-version.outputs.next_version) }}
      artifact_name: windows-alpha-management-${{ github.sha }}
    secrets: inherit
