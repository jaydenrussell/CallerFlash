name: Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup MSYS2
      run: |
        choco install msys2 -y
        choco install mingw -y
        choco install pkg-config -y
        choco install git -y
        choco install python -y
        choco install npm -y

    - name: Build PJSIP from source
      shell: msys2 {0}
      run: |
        git clone https://github.com/pjsip/pjproject.git /tmp/pjproject
        cd /tmp/pjproject
        ./configure --prefix=/mingw64 --disable-video --enable-shared=no --enable-pkg-config
        mingw32-make -j4
        mingw32-make install

    - name: Build Tauri app
      env:
        PKG_CONFIG: C:\\msys64\\usr\\bin\\pkg-config.exe
        PKG_CONFIG_PATH: C:\\msys64\\mingw64\\lib\\pkgconfig
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: npm run build:tauri