name: Build & Release

# Reusable Windows build + GitHub Release workflow.
# Callers specify channel, tag, and artifact name.

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: windows-artifact
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (unsigned)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Sanitize lockfile
        run: npm install --package-lock-only

      - name: Build frontend
        run: npm run build

      - name: Package Windows artifacts
        env:
          own_property: true
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: npx electron-builder --win --x64 --publish never --config.win.publisherName="CallerFlash"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            release/*.exe
            release/*.exe.blockmap
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.tag_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
          draft: false
          prerelease: ${{ inputs.channel != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: jaydenrussell
          REPO: CallerFlash
