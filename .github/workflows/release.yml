name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'beta*'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup MSYS2 and dependencies
      run: |
        choco install msys2 -y
        choco install mingw -y
        choco install pkg-config -y
        choco install git -y
        choco install make -y
        choco install python -y
        # Add MSYS2 to PATH
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Verify installations
      run: |
        make --version
        pkg-config --version
        node --version
        npm --version
        mingw32-make --version

    - name: Build PJSIP from source
      shell: msys2 {0}
      run: |
        git clone https://github.com/pjsip/pjproject.git /tmp/pjproject
        cd /tmp/pjproject
        ./configure --prefix=/mingw64 --disable-video --enable-shared=no --enable-pkg-config
        mingw32-make -j4
        mingw32-make install

    - name: Build Tauri app
      env:
        PKG_CONFIG: C:\\msys64\\usr\\bin\\pkg-config.exe
        PKG_CONFIG_PATH: C:\\msys64\\mingw64\\lib\\pkgconfig
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: npm run build:tauri

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Beta Release
        if: startsWith(github.ref, 'refs/tags/beta')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Beta Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Stable Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}