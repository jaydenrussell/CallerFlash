name: Build & Release

# Triggered by pushing main → stable (git push origin main:stable).
# Reads the version from Cargo.toml, creates a git tag, builds the
# Tauri app, signs it, and publishes a GitHub Release.

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $match = [regex]::Match($content, 'version = "(\d+)\.(\d+)\.(\d+)"')
          if (-not $match.Success) {
            Write-Error "Cannot parse version from Cargo.toml"
            exit 1
          }
          $major = [int]$match.Groups[1].Value
          $minor = [int]$match.Groups[2].Value
          $patch = [int]$match.Groups[3].Value
          $current = "$major.$minor.$patch"

          # z (patch) can never reach 10 — roll into minor
          if ($patch -ge 9) {
            $minor += 1
            $patch = 0
          } else {
            $patch += 1
          }

          $new = "$major.$minor.$patch"
          echo "current=$current" >> $env:GITHUB_OUTPUT
          echo "next=$new" >> $env:GITHUB_OUTPUT

      - name: Update version in all manifests
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $cur = "${{ steps.version.outputs.current }}"
          $nxt = "${{ steps.version.outputs.next }}"

          # Cargo.toml — use .Replace() for literal string replacement (no regex)
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $oldVer = 'version = "' + $cur + '"'
          $newVer = 'version = "' + $nxt + '"'
          if ($cargo -notmatch [regex]::Escape($oldVer)) {
            Write-Error "Could not find '$oldVer' in Cargo.toml"
            exit 1
          }
          $cargo = $cargo.Replace($oldVer, $newVer)
          Set-Content -Path src-tauri/Cargo.toml -Value $cargo -Encoding utf8 -NoNewline

          # package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $nxt
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json -Encoding utf8

          # tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $nxt
          $tauri | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Commit and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "callerflash-bot"
          git config user.email "bot@callerflash.app"
          git add src-tauri/Cargo.toml package.json src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
          git push

      - name: Create git tag
        run: |
          git config user.name "callerflash-bot"
          git config user.email "bot@callerflash.app"
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

  build:
    needs: tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-make
            make
            mingw-w64-x86_64-git
          release: false

      - name: Install pkg-config explicitly
        shell: msys2 {0}
        run: pacman -S --noconfirm mingw-w64-x86_64-pkgconf

      - name: Build and install PJSIP from source
        shell: msys2 {0}
        run: |
          git clone https://github.com/pjsip/pjproject.git /tmp/pjproject
          cd /tmp/pjproject
          ./configure --prefix=/mingw64 --disable-video --enable-shared=no
          mingw32-make -j4 || true
          mingw32-make install

      - name: Setup Rust (GNU target, compatible with MSYS2 PJSIP)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        run: npm run build:tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest (update.json)
        shell: pwsh
        run: |
          $version = "${{ needs.tag.outputs.version }}"
          $sigFile = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          $sig = Get-Content $sigFile.FullName -Raw
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $url = "https://github.com/jaydenrussell/CallerFlash/releases/download/v$version/$($installer.Name)"

          $json = @{
            version = $version
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = $url
              }
            }
          } | ConvertTo-Json

          $json | Set-Content -Path src-tauri/target/release/bundle/nsis/update.json -Encoding ascii

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: CallerFlash-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Updater-Artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/update.json

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append SHA256SUMS -Encoding ascii
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/update.json
            SHA256SUMS