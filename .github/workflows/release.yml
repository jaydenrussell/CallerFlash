name: Build & Release

on:
  push:
    branches: [stable]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for versioning

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -match '^refs/tags/v(.+)$') {
            # Triggered by a version tag — use the tag version
            $version = $matches[1]
            "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
            "IS_TAG_TRIGGER=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Tag trigger: version=$version"
          } else {
            # Push to stable — auto-bump patch from latest tag
            $latestTag = git tag --list 'v*' --sort=-version:refname | Select-Object -First 1
            if (-not $latestTag) { $latestTag = 'v0.0.0' }
            $baseVersion = $latestTag.TrimStart('v')
            $parts = $baseVersion.Split('.')
            $newVersion = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)
            "VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
            "IS_TAG_TRIGGER=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Push trigger: latest tag=$latestTag, bumped to $newVersion"
          }

      - name: Set version in source files
        shell: pwsh
        run: |
          $v = $env:VERSION
          # package.json
          (Get-Content package.json -Raw) -replace '"version": "\d+\.\d+\.\d+[^"]*"', '"version": "'+$v+'"' | Set-Content package.json
          # Cargo.toml
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "\d+\.\d+\.\d+[^"]*"', 'version = "'+$v+'"' | Set-Content src-tauri/Cargo.toml
          # tauri.conf.json
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version": "\d+\.\d+\.\d+[^"]*"', '"version": "'+$v+'"' | Set-Content src-tauri/tauri.conf.json
          Write-Host "Version set to $v in package.json, Cargo.toml, tauri.conf.json"

      - name: Build Tauri app
        run: npm run build:tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest (update.json)
        shell: pwsh
        run: |
          $sigFile = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          $sig = Get-Content $sigFile.FullName -Raw
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = $env:VERSION
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $url = "https://github.com/jaydenrussell/CallerFlash/releases/download/v$version/$($installer.Name)"

          $json = @{
            version = $version
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = $url
              }
            }
          } | ConvertTo-Json

          $json | Set-Content -Path src-tauri/target/release/bundle/nsis/update.json -Encoding ascii

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: CallerFlash-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Updater-Artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/update.json

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append SHA256SUMS -Encoding ascii
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-tauri') || contains(github.ref_name, '-beta') }}
          target_commitish: ${{ github.sha }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/update.json
            SHA256SUMS

      - name: Commit version bump and tag (push to stable only)
        if: env.IS_TAG_TRIGGER == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $msg = "chore: bump version to $env:VERSION"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m $msg
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"
          git push origin ${{ github.ref_name }}
          Write-Host "Version bump committed and tagged as v$env:VERSION"
