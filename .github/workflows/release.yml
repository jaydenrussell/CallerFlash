name: Release

on:
  push:
    tags:
      - 'v*'

# ---------------------------------------------------------------------------
# Release pipeline (explicit tag suffix):
#   Stable tags   -> vX.Y.Z       (e.g. v2.0.0, v2.1.0, v3.0.0). No suffix.
#   Beta tags     -> vX.Y.Z-beta (e.g. v2.0.3-beta). The "-beta" suffix is
#                    authoritative and always means prerelease; the manifest
#                    version becomes X.Y.Z-beta, which GitHub sorts below the
#                    same numeric core, so /releases/latest never surfaces a
#                    beta to stable users (beta releases are prereleases).
#
#   Flow:
#     1. promote  - classify the tag (beta vs stable), write the version into
#                   Cargo.toml / Cargo.lock / package.json / tauri.conf.json,
#                   force-sync the tag tree onto the beta or stable branch.
#     2. build    - runs on the promoted branch, gated by the `release`
#                   environment (required reviewer = repo owner). Signs with
#                   TAURI_SIGNING_PRIVATE_KEY, emits update.json + SHA256SUMS.
#     3. release  - attaches build provenance and publishes the GitHub Release
#                   (prerelease=true only for beta tags).
# ---------------------------------------------------------------------------

jobs:
  promote:
    name: Promote tag to branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_type: ${{ steps.classify.outputs.release_type }}
      version: ${{ steps.classify.outputs.version }}
      target_branch: ${{ steps.classify.outputs.target_branch }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classify release
        id: classify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $m = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)(-beta)?$')
          if (-not $m.Success) {
            throw "Tag '$tag' must match vX.Y.Z (stable) or vX.Y.Z-beta (beta)"
          }
          $version = $m.Groups[1].Value
          $isBeta = $m.Groups[2].Success
          $v = [version]$version

          $latestTag = gh release list --repo jaydenrussell/CallerFlash --exclude-pre-releases --limit 1 2>$null | ForEach-Object { ($_ -split "`t")[2] }
          if (-not $latestTag) {
            if ($isBeta) { throw "First release must be a stable tag (no '-beta' suffix), got '$tag'" }
            $releaseType = 'stable'
            $targetBranch = 'stable'
            $manifestVersion = $version
          } else {
            $latest = [version]($latestTag -replace '^v', '')
            if ($v -le $latest) {
              throw "Tag '$tag' is not ahead of latest release '$latestTag'"
            }
            if ($isBeta) {
              if ($v.Build -gt 99) { throw "Beta patch must be <= 99, got '$tag'" }
              $releaseType = 'beta'
              $targetBranch = 'beta'
              $manifestVersion = "${version}-beta"
            } else {
              $releaseType = 'stable'
              $targetBranch = 'stable'
              $manifestVersion = $version
            }
          }

          "release_type=$releaseType" >> $env:GITHUB_OUTPUT
          "version=$manifestVersion" >> $env:GITHUB_OUTPUT
          "target_branch=$targetBranch" >> $env:GITHUB_OUTPUT

      - name: Write version into manifests
        shell: pwsh
        run: |
          $v = "${{ steps.classify.outputs.version }}"

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          # Guard checks PRESENCE of the version line, not that the replace
          # changed anything - main manifests may already carry the tagged
          # version (they are bumped post-release), which is fine.
          if ($cargo -notmatch '(?m)^version = "[^"]*"$') { throw "Could not find version in Cargo.toml" }
          $new = [regex]::Replace($cargo, '(?m)^version = "[^"]*"$', 'version = "' + $v + '"')
          Set-Content src-tauri/Cargo.toml $new -Encoding utf8 -NoNewline

          $lock = Get-Content src-tauri/Cargo.lock -Raw
          $nl = if ($lock -match "`r`n") { "`r`n" } else { "`n" }
          $pattern = 'name = "callerflash"' + $nl + 'version = "[^"]+"'
          if ($lock -notmatch $pattern) { throw "Could not find callerflash in Cargo.lock" }
          $newLock = [regex]::Replace($lock, $pattern, 'name = "callerflash"' + $nl + 'version = "' + $v + '"')
          Set-Content src-tauri/Cargo.lock $newLock -Encoding utf8 -NoNewline

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json -Encoding utf8

          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $v
          $tauri | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Commit and push to ${{ steps.classify.outputs.target_branch }}
        run: |
          git config user.name "callerflash-bot"
          git config user.email "bot@callerflash.app"
          git checkout -B "${{ steps.classify.outputs.target_branch }}"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock package.json src-tauri/tauri.conf.json
          # Manifests may already be at the tagged version (bumped on main
          # post-release) - allow the no-op promote commit.
          git commit --allow-empty -m "chore: bump version to ${{ steps.classify.outputs.version }}"
          git push --force origin "${{ steps.classify.outputs.target_branch }}"

  build:
    name: Build & sign (${{ needs.promote.outputs.release_type }})
    needs: promote
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout promoted branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.promote.outputs.target_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:tauri

      - name: Generate updater manifest (update.json)
        shell: pwsh
        run: |
          $sigFile = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          $sig = Get-Content $sigFile.FullName -Raw
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = "${{ needs.promote.outputs.version }}"
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $url = "https://github.com/jaydenrussell/CallerFlash/releases/download/${{ github.ref_name }}/$($installer.Name)"

          $json = @{
            version = $version
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = $url
              }
            }
          } | ConvertTo-Json

          $json | Set-Content -Path src-tauri/target/release/bundle/nsis/update.json -Encoding ascii

      - name: Generate checksums (SHA256SUMS)
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath src-tauri/target/release/bundle/nsis/SHA256SUMS -Append -Encoding ascii
          }

      # SPDX SBOM covering both dependency trees (npm via package-lock.json,
      # Rust via Cargo.lock). Written into the bundle dir so the artifact
      # upload — and therefore the published release — carries it.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json
          output-file: src-tauri/target/release/bundle/nsis/CallerFlash_${{ needs.promote.outputs.version }}_sbom.spdx.json
          upload-artifact: false

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tauri-artifacts
          path: src-tauri/target/release/bundle/

  release:
    name: Publish ${{ needs.promote.outputs.release_type }} release
    needs: [build, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tauri-artifacts
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: artifacts/**

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jaydenrussell/CallerFlash
        run: |
          FLAG=""
          if [ "${{ needs.promote.outputs.release_type }}" = "beta" ]; then FLAG="--prerelease"; fi
          BODY=$(gh api --method POST repos/jaydenrussell/CallerFlash/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            -f target_commitish="${{ needs.promote.outputs.target_branch }}" \
            --jq '.body')
          gh release create "${{ github.ref_name }}" $(find artifacts -type f) --title "${{ github.ref_name }}" --notes "$BODY" $FLAG
