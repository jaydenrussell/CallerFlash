name: Build & Release

# Triggered by pushing a version tag (e.g., v1.5.0).
# Builds the Tauri app, signs it, creates a GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app
        run: npm run build:tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: CallerFlash-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Updater-Artifacts
          path: |
            src-tauri/target/release/bundle/nsis/*.msi
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/update.json

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append SHA256SUMS -Encoding ascii
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS
