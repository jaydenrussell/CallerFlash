name: Release

on:
  push:
    tags:
      - 'v*'
      - 'beta*'

# ---------------------------------------------------------------------------
# Cutting a beta (so beta -> beta auto-update works):
#   The update.json generated here carries `version = <tag> minus "v"`, and the
#   plugin only offers an update when that version is NEWER than the running
#   build. The running build reports the version baked into package.json /
#   src-tauri/Cargo.toml / src-tauri/tauri.conf.json at tag time, so the beta
#   tag must carry a prerelease version, e.g. "1.7.9-beta.1".
#
#   Procedure:
#     1. Set version = X.Y.Z-beta.N in all three manifests above (and run
#        `cargo check` to sync Cargo.lock).
#     2. Commit with a message starting with `chore: bump` (that prefix is the
#        only thing that stops version-bump.yml from firing on the next main
#        push).
#     3. Push main, then tag it `vX.Y.Z-beta.N` and push the tag. This workflow
#        runs the build; the app + update.json both report X.Y.Z-beta.N.
#     4. When the beta is promoted, set the manifests to X.Y.Z (stable) and
#        push a `vX.Y.Z` tag. Beta users then see X.Y.Z as an upgrade because
#        a stable release sorts higher than the same-version prerelease.
# ---------------------------------------------------------------------------

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup MSYS2 and dependencies
      run: |
        choco install msys2 -y
        choco install mingw -y
        choco install pkg-config -y
        choco install git -y
        choco install make -y
        choco install python -y
        # Add MSYS2 to PATH
        echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install npm dependencies
      run: npm ci

    - name: Verify installations
      run: |
        make --version
        pkg-config --version
        node --version
        npm --version
        mingw32-make --version

    - name: Build PJSIP from source
      run: |
        cmd.exe /c "
          C:\msys64\usr\bin\bash -lc '
            git clone https://github.com/pjsip/pjproject.git /tmp/pjproject &&
            cd /tmp/pjproject &&
            ./configure --prefix=/mingw64 --disable-video --enable-shared=no --enable-pkg-config &&
            mingw32-make -j4 &&
            mingw32-make install
          '
        "

    - name: Build Tauri app
      env:
        PKG_CONFIG: C:\\msys64\\usr\\bin\\pkg-config.exe
        PKG_CONFIG_PATH: C:\\msys64\\mingw64\\lib\\pkgconfig
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: npm run build:tauri

    - name: Generate updater manifest (update.json)
      shell: pwsh
      run: |
        $sigFile = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
        $sig = Get-Content $sigFile.FullName -Raw
        $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
        $url = "https://github.com/jaydenrussell/CallerFlash/releases/download/${{ github.ref_name }}/$($installer.Name)"

        $json = @{
          version = $version
          pub_date = $pubDate
          platforms = @{
            "windows-x86_64" = @{
              signature = $sig.Trim()
              url = $url
            }
          }
        } | ConvertTo-Json

        $json | Set-Content -Path src-tauri/target/release/bundle/nsis/update.json -Encoding ascii

    - name: Generate checksums (SHA256SUMS)
      shell: pwsh
      run: |
        Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
          $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($_.Name)" | Out-File -FilePath src-tauri/target/release/bundle/nsis/SHA256SUMS -Append -Encoding ascii
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tauri-artifacts
        path: src-tauri/target/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-artifacts
          path: artifacts

      - name: Create Beta Release
        if: contains(github.ref_name, '-beta') || startsWith(github.ref_name, 'beta')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Beta Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Stable Release
        if: "!contains(github.ref_name, '-beta') && !startsWith(github.ref_name, 'beta')"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}