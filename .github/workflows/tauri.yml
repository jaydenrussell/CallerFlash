# Build + release CallerFlash via Tauri 2.0 on the refactor/tauri branch.
# Versioning: <package.json version>-tauri (e.g. "1.4.2-tauri") so it's
# distinguishable from Electron builds but follows the same semver base.

name: Tauri Build

on:
  workflow_dispatch:
  push:
    branches: [refactor/tauri]
    paths-ignore: ["**.md", ".github/**", "!.github/workflows/tauri.yml"]

concurrency:
  group: tauri
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tag-version:
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.version.outputs.full }}
      base_ver: ${{ steps.version.outputs.base }}
      tag:      ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tauri

      - name: Read version and build tauri tag
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          FULL="${BASE}-tauri"
          TAG="v${FULL}"
          echo "base=$BASE"    >> "$GITHUB_OUTPUT"
          echo "full=$FULL"    >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping build."
            exit 1
          fi

  build:
    needs: tag-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (NSIS + updater artifacts)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build
          cargo tauri build --bundles nsis --ci

      - name: Locate bundles
        id: bundles
        shell: bash
        run: |
          BASE_VER="${{ needs.tag-version.outputs.base_ver }}"
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          INSTALLER="$NSIS_DIR/CallerFlash_${BASE_VER}_x64-setup.exe"

          if [ ! -f "$INSTALLER" ]; then
            # Fallback: find any .exe (avoid ls glob fail on empty dir)
            INSTALLER=
            for f in "$NSIS_DIR"/*.exe; do
              [ -f "$f" ] && INSTALLER="$f" && break
            done
          fi

          if [ -z "$INSTALLER" ] || [ ! -f "$INSTALLER" ]; then
            echo "No installer found!" >&2
            find "$NSIS_DIR" -maxdepth 1 -type f 2>/dev/null || echo "(directory may not exist)"
            exit 1
          fi

          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

          # Find updater artifacts: .sig file and .zip/.tar.gz bundle
          SIG="${INSTALLER}.sig"
          if [ ! -f "$SIG" ]; then
            SIG=
            for f in "$(dirname "$INSTALLER")"/*.sig; do
              [ -f "$f" ] && SIG="$f" && break
            done
          fi
          UPDATE_BUNDLE=
          BUNDLE_DIR="src-tauri/target/release/bundle"
          for d in "$BUNDLE_DIR"/*/; do
            for f in "$d"*.sig; do
              [ -f "$f" ] && [ -z "$SIG" ] && SIG="$f"
            done
            for f in "$d"*.zip "$d"*.tar.gz; do
              [ -f "$f" ] && UPDATE_BUNDLE="$f" && break 2
            done
          done

          [ -n "$SIG" ] && [ -f "$SIG" ] && echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ] && echo "update_bundle=$UPDATE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallerFlash-${{ needs.tag-version.outputs.version }}-setup
          path: ${{ steps.bundles.outputs.installer }}
          if-no-files-found: error

      - name: Create GitHub Release + update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.tag-version.outputs.tag }}"
          VERSION="${{ needs.tag-version.outputs.version }}"
          BASE_VER="${{ needs.tag-version.outputs.base_ver }}"
          INSTALLER="${{ steps.bundles.outputs.installer }}"
          SIG="${{ steps.bundles.outputs.sig }}"
          UPDATE_BUNDLE="${{ steps.bundles.outputs.update_bundle }}"

          # Create release (not latest — coexists with Electron releases)
          gh release create "$TAG" \
            --title "CallerFlash $VERSION" \
            --notes "Tauri build $VERSION — automatic release." \
            --target refactor/tauri \
            --latest=false

          # Upload NSIS installer
          gh release upload "$TAG" "$INSTALLER" --clobber

          # Upload updater bundle + signature if they exist
          if [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ]; then
            gh release upload "$TAG" "$UPDATE_BUNDLE" --clobber
          fi
          if [ -n "$SIG" ] && [ -f "$SIG" ]; then
            gh release upload "$TAG" "$SIG" --clobber
          fi

          # Generate update.json using whatever updater bundle we have
          if [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ] && [ -n "$SIG" ] && [ -f "$SIG" ]; then
            SIGNATURE=$(cat "$SIG")
            UPDATE_BASENAME=$(basename "$UPDATE_BUNDLE")
            cat > update.json <<EOF
            {
              "version": "${BASE_VER}",
              "notes": "https://github.com/jaydenrussell/CallerFlash/releases/tag/${TAG}",
              "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "platforms": {
                "windows-x86_64": {
                  "signature": "${SIGNATURE}",
                  "url": "https://github.com/jaydenrussell/CallerFlash/releases/download/${TAG}/${UPDATE_BASENAME}"
                }
              }
            }
            EOF

            # Upload update.json to this release
            gh release upload "$TAG" update.json --clobber

            # Push a floating latest-tauri tag so the updater endpoint stays fixed
            git config user.email "ci@callerflash.app"
            git config user.name "CI"
            git tag -f latest-tauri HEAD
            git push origin latest-tauri --force

            # Upload update.json to the floating tag too
            gh release upload latest-tauri update.json --clobber 2>/dev/null || \
              (gh release create latest-tauri \
                --title "Latest Tauri Build" \
                --notes "Floating tag pointing to the latest Tauri release." \
                --target refactor/tauri \
                --latest=false && \
               gh release upload latest-tauri update.json --clobber)
          else
            echo "No updater artifacts found — skipping update.json generation"
          fi
