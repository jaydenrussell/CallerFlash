# Build + release CallerFlash via Tauri 2.0 on the refactor/tauri branch.
# Versioning: <package.json version>-tauri (e.g. "1.4.2-tauri") so it's
# distinguishable from Electron builds but follows the same semver base.

name: Tauri Build

on:
  workflow_dispatch:
  push:
    branches: [refactor/tauri]
    paths-ignore: ["**.md", ".github/**", "!.github/workflows/tauri.yml"]

concurrency:
  group: tauri
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tag-version:
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.version.outputs.full }}
      base_ver: ${{ steps.version.outputs.base }}
      tag:      ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refactor/tauri

      - name: Read version and auto-bump if tag exists
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")

          # Auto-increment patch until we find a free tag
          while true; do
            FULL="${BASE}-tauri"
            TAG="v${FULL}"
            if ! git ls-remote --tags origin "$TAG" | grep -q .; then
              break
            fi
            echo "Tag $TAG already exists — bumping patch."
            BASE=$(echo "$BASE" | awk -F. '{print $1"."$2"."$3+1}')
          done

          echo "base=$BASE"    >> "$GITHUB_OUTPUT"
          echo "full=$FULL"    >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"      >> "$GITHUB_OUTPUT"

  build:
    needs: tag-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refactor/tauri

      - name: Patch version files with auto-bumped version
        shell: bash
        run: |
          FULL="${{ needs.tag-version.outputs.version }}"
          node -e "
            const p = require('./package.json');
            p.version = '$FULL';
            require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          "
          sed -i "s/^version = \".*\"/version = \"$FULL\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"$FULL\"/" src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Rust format check
        shell: bash
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust audit
        shell: bash
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cd src-tauri && cargo audit

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (NSIS + updater artifacts)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build
          cargo tauri build --bundles nsis --ci

      - name: Locate bundles
        id: bundles
        shell: bash
        run: |
          set +e
          FULL_VER="${{ needs.tag-version.outputs.version }}"
          BASE_VER="${{ needs.tag-version.outputs.base_ver }}"
          BUNDLE_ROOT="src-tauri/target/release/bundle"
          echo "--- Bundle root contents ---"
          find "$BUNDLE_ROOT" -type f 2>/dev/null || echo "(bundle root not found)"
          echo "---"

          INSTALLER=
          # Try exact expected name first (full version includes -tauri suffix)
          EXACT="$BUNDLE_ROOT/nsis/CallerFlash_${FULL_VER}_x64-setup.exe"
          [ -f "$EXACT" ] && INSTALLER="$EXACT"

          # Fallback: any .exe in nsis dir
          if [ -z "$INSTALLER" ]; then
            for f in "$BUNDLE_ROOT/nsis/"*.exe; do
              [ -f "$f" ] && INSTALLER="$f" && break
            done
          fi

          # Final fallback: any .exe anywhere under bundle
          if [ -z "$INSTALLER" ]; then
            INSTALLER=$(find "$BUNDLE_ROOT" -name '*.exe' -type f 2>/dev/null | head -1)
          fi

          if [ -z "$INSTALLER" ] || [ ! -f "$INSTALLER" ]; then
            echo "::error::No installer found!"
            echo "Full bundle tree:"
            find "$BUNDLE_ROOT" -type f 2>/dev/null || echo "(no bundle dir)"
            exit 1
          fi

          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

          # Find updater artifacts
          SIG=
          for f in "$(dirname "$INSTALLER")"/*.sig "$BUNDLE_ROOT"/*/*.sig; do
            [ -f "$f" ] && SIG="$f" && break
          done

          UPDATE_BUNDLE=
          for f in "$BUNDLE_ROOT"/*/*.zip "$BUNDLE_ROOT"/*/*.tar.gz; do
            [ -f "$f" ] && UPDATE_BUNDLE="$f" && break
          done

          # For NSIS, Tauri does not produce a separate archive — use installer as bundle
          if [ -z "$UPDATE_BUNDLE" ] && [ -f "$INSTALLER" ]; then
            UPDATE_BUNDLE="$INSTALLER"
          fi

          [ -n "$SIG" ] && [ -f "$SIG" ] && echo "sig=$SIG" >> "$GITHUB_OUTPUT" || true
          [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ] && echo "update_bundle=$UPDATE_BUNDLE" >> "$GITHUB_OUTPUT" || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CallerFlash-${{ needs.tag-version.outputs.version }}-setup
          path: ${{ steps.bundles.outputs.installer }}
          if-no-files-found: error

      - name: Create GitHub Release + update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.tag-version.outputs.tag }}"
          VERSION="${{ needs.tag-version.outputs.version }}"
          BASE_VER="${{ needs.tag-version.outputs.base_ver }}"
          INSTALLER="${{ steps.bundles.outputs.installer }}"
          SIG="${{ steps.bundles.outputs.sig }}"
          UPDATE_BUNDLE="${{ steps.bundles.outputs.update_bundle }}"

          # Create release (not latest — coexists with Electron releases)
          gh release create "$TAG" \
            --title "CallerFlash $VERSION" \
            --notes "Tauri build $VERSION — automatic release." \
            --target refactor/tauri \
            --latest=false

          # Upload NSIS installer
          gh release upload "$TAG" "$INSTALLER" --clobber

          # Upload updater bundle + signature if they exist
          if [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ]; then
            gh release upload "$TAG" "$UPDATE_BUNDLE" --clobber
          fi
          if [ -n "$SIG" ] && [ -f "$SIG" ]; then
            gh release upload "$TAG" "$SIG" --clobber
          fi

          # Generate update.json using whatever updater bundle we have
          if [ -n "$UPDATE_BUNDLE" ] && [ -f "$UPDATE_BUNDLE" ] && [ -n "$SIG" ] && [ -f "$SIG" ]; then
            SIGNATURE=$(cat "$SIG")
            UPDATE_BASENAME=$(basename "$UPDATE_BUNDLE")
            PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            UPDATE_URL="https://github.com/jaydenrussell/CallerFlash/releases/download/${TAG}/${UPDATE_BASENAME}"
            printf '{"version":"%s","notes":"https://github.com/jaydenrussell/CallerFlash/releases/tag/%s","pub_date":"%s","platforms":{"windows-x86_64":{"signature":"%s","url":"%s"}}}\n' \
              "$VERSION" "$TAG" "$PUB_DATE" "$SIGNATURE" "$UPDATE_URL" > update.json

            # Upload update.json to this release
            gh release upload "$TAG" update.json --clobber

            # Push a floating latest-tauri tag so the updater endpoint stays fixed
            git config user.email "ci@callerflash.app"
            git config user.name "CI"
            git tag -f latest-tauri HEAD
            git push origin latest-tauri --force

            # Upload update.json to the floating tag too
            gh release upload latest-tauri update.json --clobber 2>/dev/null || \
              (gh release create latest-tauri \
                --title "Latest Tauri Build" \
                --notes "Floating tag pointing to the latest Tauri release." \
                --target refactor/tauri \
                --latest=false && \
               gh release upload latest-tauri update.json --clobber)
          else
            echo "No updater artifacts found — skipping update.json generation"
          fi
