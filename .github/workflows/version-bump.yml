name: Auto Version Bump

# Bumps the patch version on every push to main (or minor if patch ≥ 9).
# The z/patch digit never exceeds 9 — hitting 9 rolls into a minor bump.
# Uses [skip ci] so this workflow does not re-trigger itself.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full history so we can detect the auto-bump bot's own
          # commits and avoid re-trigger loops.
          fetch-depth: 0

      - name: Check if latest commit is already a version bump
        id: skip_check
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=%B
          $skip = "false"
          if ($msg -match '^chore: bump') {
            $skip = "true"
          }
          echo "skip=$skip" >> $env:GITHUB_OUTPUT

      - name: Compute next version
        id: version
        if: steps.skip_check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/Cargo.toml -Raw
          # Tolerate a prerelease suffix (e.g. 1.7.9-beta.1) so a beta version
          # parked on main doesn't break the next auto-bump. Only the numeric
          # core is used to compute the next version.
          $match = [regex]::Match($content, 'version = "(\d+)\.(\d+)\.(\d+)(?:-\w[\w.]*)?"')
          if (-not $match.Success) {
            Write-Error "Cannot parse version from Cargo.toml"
            exit 1
          }
          $major = [int]$match.Groups[1].Value
          $minor = [int]$match.Groups[2].Value
          $patch = [int]$match.Groups[3].Value
          $current = "$major.$minor.$patch"

          # z (patch) can never reach 10 — roll into minor
          if ($patch -ge 9) {
            $minor += 1
            $patch = 0
          } else {
            $patch += 1
          }

          $new = "$major.$minor.$patch"
          echo "current=$current" >> $env:GITHUB_OUTPUT
          echo "next=$new" >> $env:GITHUB_OUTPUT

      - name: Update version in all manifests
        if: steps.skip_check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $cur = "${{ steps.version.outputs.current }}"
          $nxt = "${{ steps.version.outputs.next }}"

          # Cargo.toml — regex-replace the version entry so any prerelease
          # suffix is dropped (the auto-bump always yields a plain numeric)
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $newVer = 'version = "' + $nxt + '"'
          $replaced = [regex]::Replace($cargo, 'version = "\d+\.\d+\.\d+(?:-\w[\w.]*)?"', $newVer)
          if ($replaced -eq $cargo) {
            Write-Error "Could not find a version entry in Cargo.toml"
            exit 1
          }
          $cargo = $replaced
          Set-Content -Path src-tauri/Cargo.toml -Value $cargo -Encoding utf8 -NoNewline

          # package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $nxt
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json -Encoding utf8

          # tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $nxt
          $tauri | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Commit and push
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          git config user.name "callerflash-bot"
          git config user.email "bot@callerflash.app"
          git add src-tauri/Cargo.toml package.json src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
          git push
