<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow:hidden;background:transparent;font-family:'Segoe UI',system-ui,sans-serif}
.toast{
  width:100%;
  background:#1a1a2e;
  border-radius:16px;
  border:2px solid rgba(96,205,255,0.4);
  box-shadow:0 12px 40px rgba(0,0,0,0.8),0 0 60px rgba(96,205,255,0.15);
  overflow:hidden;
  position:relative;
  cursor:pointer;
  animation:slideIn .35s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes slideIn{from{transform:translateY(-20px)}to{transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:0}}
.accent{position:absolute;top:0;left:0;width:5px;height:100%;background:#60cdff;box-shadow:0 0 12px #60cdff}
.body{padding:18px 20px 18px 24px;display:flex;gap:14px}
.icon{
  width:48px;height:48px;border-radius:50%;
  background:rgba(96,205,255,0.2);
  display:grid;place-items:center;
  flex-shrink:0;position:relative;margin-top:2px;
  -webkit-app-region:no-drag
}
.ping{
  position:absolute;top:-2px;right:-2px;
  width:12px;height:12px;border-radius:50%;
  background:#6ccb5f;
  animation:pulse 1.2s ease-in-out infinite
}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;-webkit-app-region:drag}
.title{font-size:13px;font-weight:600;color:#60cdff;text-transform:uppercase;letter-spacing:1px;-webkit-app-region:no-drag}
.time{font-size:11px;color:rgba(255,255,255,0.4);white-space:nowrap;margin-left:12px;-webkit-app-region:no-drag}
.number{font-size:22px;font-weight:700;color:#fff;letter-spacing:.5px;word-break:break-all}
.name{font-size:14px;color:rgba(255,255,255,0.7);margin-top:2px}
.progress{position:absolute;bottom:0;left:0;width:100%;height:4px;background:rgba(96,205,255,0.1)}
.progress-bar{height:100%;width:100%;background:#60cdff;transition:width 100ms linear}
</style>
</head>
<body>
<div class="toast" id="toast">
  <div class="accent"></div>
  <div class="body">
    <div class="icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60cdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <div class="ping"></div>
    </div>
    <div class="info">
      <div class="top-row">
        <div class="title" id="title">Incoming Call</div>
        <div class="time" id="time"></div>
      </div>
      <div class="number" id="number">Waiting...</div>
      <div class="name" id="name"></div>
    </div>
  </div>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
</div>
<script>
(function(){
  var toastEl = document.getElementById('toast');
  var numberEl = document.getElementById('number');
  var nameEl = document.getElementById('name');
  var timeEl = document.getElementById('time');
  var progressEl = document.getElementById('progress');
  var closed = false;

  // Click anywhere on the toast to close it
  toastEl.addEventListener('click', function(e) {
    if (e.target.closest('.top-row')) return; // allow drag on top-row
    if (!closed) {
      closed = true;
      window.close();
    }
  });

  // Close on right-click as well
  toastEl.addEventListener('contextmenu', function() {
    if (!closed) {
      closed = true;
      window.close();
    }
  });

  function applyData(data) {
    if (!data) return;
    var c = data.config || {};

    if (data.callerNumber) numberEl.textContent = data.callerNumber;
    if (data.callerName) nameEl.textContent = data.callerName;
    if (data.timestamp) {
      try { timeEl.textContent = new Date(data.timestamp).toLocaleTimeString(); } catch(e) {}
    }

    var accent = c.accentColor || '#60cdff';
    var bg = c.backgroundColor || '#1a1a2e';
    var text = c.textColor || '#ffffff';

    if (bg) toastEl.style.background = bg;
    if (accent) {
      document.querySelector('.accent').style.background = accent;
      document.querySelector('.accent').style.boxShadow = '0 0 12px ' + accent;
      document.querySelector('.icon').style.background = accent + '20';
      var svg = document.querySelector('.icon svg');
      if (svg) svg.setAttribute('stroke', accent);
      progressEl.style.background = accent;
      document.querySelector('.progress').style.background = accent + '10';
      document.getElementById('title').style.color = accent;
    }
    if (text) {
      numberEl.style.color = text;
      nameEl.style.color = 'rgba(' + hexToRgb(text) + ',0.7)';
      timeEl.style.color = 'rgba(' + hexToRgb(text) + ',0.4)';
    }
    if (c.borderRadius != null) toastEl.style.borderRadius = c.borderRadius + 'px';
    if (c.opacity != null) {
      // Apply opacity after slideIn animation completes (350ms)
      setTimeout(function() {
        toastEl.style.opacity = (c.opacity / 100);
      }, 400);
    }
    if (c.fontFamily) document.body.style.fontFamily = c.fontFamily;
    if (c.fontSize) {
      var fs = parseInt(c.fontSize, 10);
      numberEl.style.fontSize = (fs + 4) + 'px';
      nameEl.style.fontSize = (fs - 2) + 'px';
      timeEl.style.fontSize = (fs - 4) + 'px';
      document.querySelector('.title').style.fontSize = Math.max(11, fs - 2) + 'px';
    }
    if (c.showCallerName === false) nameEl.style.display = 'none';
    else nameEl.style.display = '';
    if (c.showTimestamp === false) timeEl.style.display = 'none';
    else timeEl.style.display = '';
    if (c.maxWidth) toastEl.style.maxWidth = c.maxWidth + 'px';

    // Auto-copy indicator
    if (c.autoCopyToClipboard) {
      var hint = document.querySelector('.auto-copy-hint');
      if (!hint) {
        hint = document.createElement('div');
        hint.className = 'auto-copy-hint';
        hint.textContent = 'Number auto-copied to clipboard';
        hint.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px;';
        document.querySelector('.info').appendChild(hint);
      }
    } else {
      var existing = document.querySelector('.auto-copy-hint');
      if (existing) existing.remove();
    }

    // Resize window to fit content
    requestAnimationFrame(function() {
      try {
        if (window.callerflash && window.callerflash.toast && window.callerflash.toast.resizeContent) {
          window.callerflash.toast.resizeContent();
        }
      } catch(e) {
        console.log('[toast.html] resize error:', e);
      }
    });

    // Restart progress + auto-close
    var duration = parseInt(c.duration, 10) || 10;
    var durationMs = duration * 1000;
    var start = Date.now();
    closed = false;

    if (window._toastTimer) clearTimeout(window._toastTimer);
    if (window._toastRaf) cancelAnimationFrame(window._toastRaf);

    function updateProgress() {
      if (closed) return;
      var elapsed = Date.now() - start;
      var remaining = Math.max(0, durationMs - elapsed);
      progressEl.style.width = (remaining / durationMs * 100) + '%';
      if (remaining > 0) {
        window._toastRaf = requestAnimationFrame(updateProgress);
      }
    }
    window._toastRaf = requestAnimationFrame(updateProgress);

    window._toastTimer = setTimeout(function(){
      if (!closed) {
        closed = true;
        console.log('[toast.html] auto-close timer fired');
        window.close();
      }
    }, durationMs + 500);
  }

  console.log('[toast.html] script executing, window.callerflash.toast =', typeof window.callerflash?.toast?.getInitial);

  try {
    window.callerflash.toast.getInitial().then(function(data) {
      if (data) {
        console.log('[toast.html] getInitial returned data, calling applyData');
        applyData(data);
      } else {
        console.log('[toast.html] getInitial returned null — no pending data');
      }
    }).catch(function(err) {
      console.log('[toast.html] getInitial error:', err);
    });
  } catch(e) {
    console.log('[toast.html] getInitial threw:', e);
  }

  try {
    window.callerflash.toast.onShow(function(data) {
      if (data) {
        console.log('[toast.html] onShow received data, calling applyData');
        applyData(data);
      }
    });
    console.log('[toast.html] onShow subscriber attached');
  } catch(e) {
    console.log('[toast.html] onShow threw:', e);
  }

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var r = parseInt(hex.substring(0,2), 16);
    var g = parseInt(hex.substring(2,4), 16);
    var b = parseInt(hex.substring(4,6), 16);
    return r+','+g+','+b;
  }
})();
</script>
</body>
</html>
