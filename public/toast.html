<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'">
  <title>CallerFlash Toast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
    }
    @keyframes toast-in {
      0% { transform: translateY(-20px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes ring {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(8deg); }
      40% { transform: rotate(-6deg); }
      60% { transform: rotate(4deg); }
      80% { transform: rotate(-2deg); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes wave {
      0% { box-shadow: 0 0 0 0 var(--accent); }
      100% { box-shadow: 0 0 0 12px transparent; }
    }
    .toast {
      position: relative;
      width: 100%; height: 100%;
      padding: 0;
      border-radius: 14px;
      background: rgba(22, 22, 40, 0.92);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-app-region: drag;
      animation: toast-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow: hidden;
    }
    .toast-inner {
      position: relative;
      z-index: 1;
      padding: 14px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .progress-rail {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.04);
      z-index: 2;
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent), 0 0 20px color-mix(in srgb, var(--accent) 50%, transparent);
      transition: width 100ms linear;
    }
    .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .icon-ring {
      position: relative;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      --accent: #60cdff;
      animation: wave 1.5s ease-out infinite;
    }
    .icon-ring svg {
      width: 16px;
      height: 16px;
      color: #fff;
      animation: ring 1s ease-in-out infinite;
    }
    .icon-ring .dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6ccb5f;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    .header-text {
      flex: 1;
      min-width: 0;
    }
    .header-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .header-time {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-align: right;
      flex-shrink: 0;
      margin-left: auto;
    }
    .caller-number {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      line-height: 1.2;
      padding-left: 42px;
    }
    .caller-name {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      padding-left: 42px;
      margin-top: 2px;
      line-height: 1.3;
    }
    .caller-name:empty { display: none; }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="toast-inner">
      <div class="top-row">
        <div class="icon-ring" id="iconRing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <div class="dot"></div>
        </div>
        <span class="header-title" id="headerTitle">Incoming Call</span>
        <span class="header-time" id="timestamp"></span>
      </div>
      <span class="caller-number" id="callerNumber"></span>
      <span class="caller-name" id="callerName"></span>
    </div>
    <div class="progress-rail">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var elNumber = document.getElementById('callerNumber');
      var elName = document.getElementById('callerName');
      var elTime = document.getElementById('timestamp');
      var elTitle = document.getElementById('headerTitle');
      var elToast = document.getElementById('toast');
      var elIcon = document.getElementById('iconRing');
      var elProg = document.getElementById('progressFill');

      var hideTimer = null;
      var progTimer = null;
      var dur = 5000;

      function fmt(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function show(data) {
        var c = data.config || {};
        dur = (typeof c.duration === 'number' ? c.duration : 5) * 1000;

        elNumber.textContent = data.callerNumber || 'Unknown';
        elName.textContent = data.callerName || '';
        elName.style.display = data.callerName ? '' : 'none';
        elTime.textContent = fmt(data.timestamp);
        elTime.style.display = c.showTimestamp !== false ? '' : 'none';

        if (c.fontFamily) elToast.style.fontFamily = c.fontFamily;
        if (c.fontSize) {
          var b = c.fontSize;
          elNumber.style.fontSize = b + 'px';
          elName.style.fontSize = Math.max(10, b - 4) + 'px';
          elTime.style.fontSize = Math.max(9, b - 6) + 'px';
          elTitle.style.fontSize = Math.max(10, b - 5) + 'px';
        }
        if (c.backgroundColor) elToast.style.background = c.backgroundColor;
        if (c.accentColor) {
          var a = c.accentColor;
          elIcon.style.setProperty('--accent', a);
          elTitle.style.color = a;
          elProg.style.background = a;
          elProg.style.boxShadow = '0 0 6px ' + a + ', 0 0 20px ' + a + '80';
        }
        if (c.borderRadius) elToast.style.borderRadius = c.borderRadius + 'px';
        if (c.opacity !== undefined) elToast.style.opacity = String(c.opacity);

        // reset
        elProg.style.width = '100%';
        if (progTimer) clearInterval(progTimer);
        if (hideTimer) clearTimeout(hideTimer);

        if (dur > 0) {
          var start = Date.now();
          progTimer = setInterval(function() {
            var pct = Math.max(0, (dur - (Date.now() - start)) / dur * 100);
            elProg.style.width = pct + '%';
            if (pct <= 0) clearInterval(progTimer);
          }, 30);

          hideTimer = setTimeout(function() {
            clearInterval(progTimer);
            window.__TAURI__.core.invoke('toast_hide').catch(function() {});
          }, dur);
        }
      }

      window.__TAURI__.core.invoke('toast_get_initial').then(function(d) { if (d) show(d); }).catch(function() {});

      window.__TAURI__.event.listen('toast:show:event', function(e) { if (e.payload) show(e.payload); }).catch(function() {});

      elToast.addEventListener('click', function() {
        if (hideTimer) clearTimeout(hideTimer);
        if (progTimer) clearInterval(progTimer);
        window.__TAURI__.core.invoke('toast_hide').catch(function() {});
      });

      function playTone(t) {
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var g = ctx.createGain();
          osc.connect(g);
          g.connect(ctx.destination);
          if (t === 'ring') {
            osc.type = 'sine'; osc.frequency.value = 440; g.gain.value = 0.3;
            osc.start(); osc.stop(ctx.currentTime + 0.5);
          } else if (t === 'beep') {
            osc.type = 'square'; osc.frequency.value = 800; g.gain.value = 0.2;
            osc.start(); osc.stop(ctx.currentTime + 0.15);
          } else if (t === 'gentle') {
            osc.type = 'sine'; osc.frequency.value = 523; g.gain.value = 0.15;
            g.gain.setValueAtTime(0.15, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
            osc.start(); osc.stop(ctx.currentTime + 0.8);
          } else {
            osc.type = 'sine'; osc.frequency.value = 880; g.gain.value = 0.2;
            osc.start(); osc.stop(ctx.currentTime + 0.2);
          }
        } catch(e) { console.log('[toast] audio error:', e); }
      }

      window.__TAURI__.event.listen('toast:show:event', function(e) {
        var c = (e.payload && e.payload.config) || {};
        if (c.soundEnabled !== false) playTone(c.soundName || 'chime');
      }).catch(function() {});
    })();
  </script>
</body>
</html>
