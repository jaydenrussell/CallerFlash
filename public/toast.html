<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'">
  <title>CallerFlash Toast</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
    }
    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }
    @keyframes ring-glow {
      0%, 100% { box-shadow: 0 0 4px rgba(96, 205, 255, 0.3); }
      50% { box-shadow: 0 0 14px rgba(96, 205, 255, 0.7); }
    }
    @keyframes slideIn {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .toast {
      position: relative;
      width: 100%; height: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(30, 30, 50, 0.85);
      border: 1px solid rgba(96, 205, 255, 0.3);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-app-region: drag;
      animation: slideIn 0.3s cubic-bezier(.16,1,.3,1) forwards;
      overflow: hidden;
    }
    .accent-bar {
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: #60cdff;
    }
    .toast-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .toast-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .toast-header-right {
      margin-left: auto;
      flex-shrink: 0;
    }
    .toast-icon-wrap {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ring-pulse 1.2s ease-in-out infinite, ring-glow 1.2s ease-in-out infinite;
    }
    .toast-icon {
      width: 18px;
      height: 18px;
      color: #60cdff;
    }
    .toast-title {
      font-size: 13px;
      font-weight: 600;
      color: #60cdff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .toast-timestamp {
      font-size: 11px;
      font-weight: 600;
      color: #60cdff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .toast-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 28px;
    }
    .caller-number {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .caller-name {
      font-size: 14px;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
    }
    .caller-name:empty { display: none; }
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(96, 205, 255, 0.08);
    }
    .progress-bar {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      background: #60cdff;
      box-shadow: 0 0 8px #60cdff, 0 0 16px rgba(96, 205, 255, 0.4);
      transition: width 80ms linear;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="accent-bar"></div>
    <div class="toast-header">
      <div class="toast-header-left">
        <div class="toast-icon-wrap">
          <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <span class="toast-title">Incoming Call</span>
      </div>
      <div class="toast-header-right">
        <span class="toast-timestamp" id="timestamp"></span>
      </div>
    </div>
    <div class="toast-body">
      <span class="caller-number" id="callerNumber"></span>
      <span class="caller-name" id="callerName"></span>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const elNumber = document.getElementById('callerNumber');
      const elName = document.getElementById('callerName');
      const elTimestamp = document.getElementById('timestamp');
      const elToast = document.getElementById('toast');
      const elProgress = document.getElementById('progressBar');
      const elIconWrap = document.querySelector('.toast-icon-wrap');

      let hideTimer = null;
      let progressInterval = null;
      let currentDuration = 5000;

      function formatTimestamp(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function showCall(data) {
        const config = data.config || {};
        var durationSec = (typeof config.duration === 'number' ? config.duration : 5);
        currentDuration = durationSec * 1000;

        elNumber.textContent = data.callerNumber || 'Unknown';
        elName.textContent = data.callerName || '';
        elName.style.display = data.callerName ? '' : 'none';
        elTimestamp.textContent = formatTimestamp(data.timestamp);
        elTimestamp.style.display = config.showTimestamp !== false ? '' : 'none';

        if (config.fontFamily) {
          elToast.style.fontFamily = config.fontFamily;
        }
        if (config.fontSize) {
          var base = config.fontSize;
          elNumber.style.fontSize = base + 'px';
          elName.style.fontSize = Math.max(10, base - 4) + 'px';
          elTimestamp.style.fontSize = Math.max(9, base - 6) + 'px';
        }
        if (config.backgroundColor) {
          elToast.style.background = config.backgroundColor;
        }
        if (config.accentColor) {
          var accent = config.accentColor;
          elToast.querySelector('.accent-bar').style.background = accent;
          elToast.querySelector('.toast-title').style.color = accent;
          elTimestamp.style.color = accent;
          elIconWrap.style.setProperty('--accent', accent);
          elProgress.style.background = accent;
          elProgress.style.boxShadow = '0 0 8px ' + accent + ', 0 0 16px ' + accent + '66';
          elProgress.parentElement.style.background = accent + '14';
          elToast.style.borderColor = accent + '55';
        }
        if (config.borderRadius) {
          elToast.style.borderRadius = config.borderRadius + 'px';
        }
        if (config.opacity !== undefined) {
          elToast.style.opacity = String(config.opacity);
        }

        // Reset progress bar
        elProgress.style.width = '100%';
        if (progressInterval) clearInterval(progressInterval);

        if (hideTimer) clearTimeout(hideTimer);
        if (currentDuration > 0) {
          var startTime = Date.now();
          progressInterval = setInterval(function () {
            var elapsed = Date.now() - startTime;
            var remaining = Math.max(0, currentDuration - elapsed);
            var pct = (remaining / currentDuration) * 100;
            elProgress.style.width = pct + '%';
            if (pct <= 0) clearInterval(progressInterval);
          }, 40);

          hideTimer = setTimeout(function () {
            clearInterval(progressInterval);
            window.__TAURI__.core.invoke('toast_hide').catch(function () {});
          }, currentDuration);
        }
      }

      window.__TAURI__.core.invoke('toast_get_initial').then(data => {
        if (data) showCall(data);
      }).catch(() => {});

      window.__TAURI__.event.listen('toast:show:event', (event) => {
        if (event.payload) showCall(event.payload);
      }).catch(() => {});

      elToast.addEventListener('click', () => {
        if (hideTimer) clearTimeout(hideTimer);
        if (progressInterval) clearInterval(progressInterval);
        window.__TAURI__.core.invoke('toast_hide').catch(() => {});
      });

      function playTone(type) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          switch(type) {
            case 'ring':
              osc.type = 'sine';
              osc.frequency.value = 440;
              gain.gain.value = 0.3;
              osc.start();
              osc.stop(ctx.currentTime + 0.5);
              break;
            case 'beep':
              osc.type = 'square';
              osc.frequency.value = 800;
              gain.gain.value = 0.2;
              osc.start();
              osc.stop(ctx.currentTime + 0.15);
              break;
            case 'gentle':
              osc.type = 'sine';
              osc.frequency.value = 523;
              gain.gain.value = 0.15;
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
              osc.start();
              osc.stop(ctx.currentTime + 0.8);
              break;
            default:
              osc.type = 'sine';
              osc.frequency.value = 880;
              gain.gain.value = 0.2;
              osc.start();
              osc.stop(ctx.currentTime + 0.2);
              break;
          }
        } catch(e) {
          console.log('[toast] audio error:', e);
        }
      }

      window.__TAURI__.event.listen('toast:show:event', (event) => {
        const config = (event.payload && event.payload.config) || {};
        if (config.soundEnabled !== false) {
          playTone(config.soundName || 'chime');
        }
      }).catch(() => {});
    })();
  </script>
</body>
</html>
