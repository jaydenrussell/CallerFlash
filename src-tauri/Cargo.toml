[package]
name = "callerflash"
version = "1.9.6-beta"
description = "SIP-compliant client with toast notifications for any standard SIP provider"
authors = ["CallerFlash"]
license = "MIT"
repository = "https://github.com/jaydenrussell/CallerFlash"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
embed-resource = "3"

[features]
default = ["migration"]
# Migration from Sip-Toast: decrypt legacy encrypted configs on first run
migration = ["dep:aes-gcm", "dep:hmac", "dep:sha2"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tracing-log = "0.2"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
futures-util = "0.3"
rsipstack = "0.6"
rustls-native-certs = "0.8"
open = "5"
arboard = "3"
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
once_cell = "1.20"
ed25519-dalek = "3"
hex = "0.4"
secrecy = "0.10"
aes-gcm = { version = "0.10", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
gdkwayland-sys = { path = "vendor/gdkwayland-sys" }
