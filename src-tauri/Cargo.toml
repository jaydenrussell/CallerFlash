[package]
name = "callerflash"
version = "1.4.5"
description = "SIP-compliant client with toast notifications for any standard SIP provider"
authors = ["CallerFlash"]
license = "MIT"
repository = "https://github.com/jaydenrussell/CallerFlash"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
md-5 = "0.10"
rand = "0.8"
hex = "0.4"
subtle = "2"
open = "5"
winreg = "0.52"
